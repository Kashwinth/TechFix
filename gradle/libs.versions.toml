[versions]
agp = "9.1.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
activity = "1.13.0"
constraintlayout = "2.2.2"
room = "2.7.1"
lifecycle = "2.9.1"
recyclerview = "1.4.0"
playServicesMaps = "19.2.0"

[libraries]
